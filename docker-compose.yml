services:

  postgres:
    image: postgres:15
    container_name: postgres_analytics
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"

  airflow-postgres:
    image: postgres:15
    container_name: airflow_metadata_db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"

  airflow-init:
    image: apache/airflow:2.9.3
    depends_on:
      - airflow-postgres
      - postgres
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW_CONN_POSTGRES_ANALYTICS: postgresql://airflow:airflow@postgres_analytics:5432/analytics
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@email.com || true &&

      airflow connections add postgres_analytics
      --conn-type postgres
      --conn-host postgres_analytics
      --conn-login airflow
      --conn-password airflow
      --conn-port 5432
      --conn-schema analytics || true &&

      airflow pools set ecommerce_pool 2 'Pool para processamento ecommerce' || true
      "

  airflow-webserver:
    image: apache/airflow:2.9.3
    container_name: airflow_webserver
    depends_on:
      - airflow-init
    restart: always
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW_CONN_POSTGRES_ANALYTICS: postgresql://airflow:airflow@postgres_analytics:5432/analytics
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: webserver
    ports:
      - "8080:8080"

  airflow-scheduler:
    image: apache/airflow:2.9.3
    container_name: airflow_scheduler
    depends_on:
      - airflow-init
    restart: always
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW_CONN_POSTGRES_ANALYTICS: postgresql://airflow:airflow@postgres_analytics:5432/analytics
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: scheduler